<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fajar Panca — Frontend Developer</title>
    <meta name="description" content="Frontend developer with 6+ years of experience building mobile apps with React Native." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..500&family=Geist+Mono:wght@400;500&family=Roboto+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { margin: 0; background: #f9f9f9; }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background: #0a0a0a; }
      }
    </style>
    <meta name="theme-color" content="#f9f9f9" />
    <script>
      document.documentElement.classList.add("js");
      var theme = document.querySelector('meta[name="theme-color"]');
      if (theme && matchMedia("(prefers-color-scheme: dark)").matches) theme.setAttribute("content", "#0a0a0a");
    </script>
  </head>
  <body>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "").toLowerCase();
        var other = path.indexOf("/qris") === 0 || path === "/add-address" || path === "/list-address" || path === "/admin";
        if (!other) document.body.classList.add("is-folio");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
