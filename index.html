<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fajar Panca — Frontend Developer</title>
    <meta name="description" content="Frontend developer with 6+ years of experience building mobile apps with React Native." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..500&family=Geist+Mono:wght@400;500&family=Roboto+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { margin: 0; background: #f9f9f9; color-scheme: light; }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root { background: #0a0a0a; color-scheme: dark; }
    </style>
    <meta name="theme-color" content="#f9f9f9" />
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("folio-theme"); } catch (e) {}
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.classList.add("js");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0a0a" : "#f9f9f9");
      })();
    </script>
  </head>
  <body>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "").toLowerCase();
        var other = path.indexOf("/qris") === 0 || path === "/add-address" || path === "/list-address" || path === "/admin";
        if (!other) document.body.classList.add("is-folio");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
